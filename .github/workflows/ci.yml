# ✅ 정합성 게이트 — 원천(references/*.md) · 합본(PLAYBOOK.md) · 스킬(SKILL.md) ·
# MCP 서버가 서로 어긋나지 않는지 매 푸시마다 검사한다.
# 플레이북 2.5의 원칙("합칠 수 없으면 어긋날 때 깨지게 묶어라")을 이 저장소 자신에게 적용.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # dist/ 는 .gitignore 대상이라 체크아웃에 없다. 테스트가 dist/data.json을 읽으므로
      # 먼저 만들어 준다. build:site는 dist/ 에만 쓰므로 아래 합본 신선도 검사를
      # 무력화하지 않는다 — 여기서 `npm run build`(합본까지 재생성)를 부르면 안 된다.
      - name: 웹 앱 산출물 생성
        run: npm run build:site

      # 의존성 0개 — npm ci 할 것이 없다.
      - name: MCP 스모크 + 정합성 검사
        run: npm test

      # 합본을 손으로 고치고 빌드를 잊는 것이 가장 흔한 사고다.
      # npm test가 이미 잡지만, 빌드가 정말 무변화인지 한 번 더 못 박는다.
      - name: 빌드가 멱등한지 확인
        run: |
          npm run build
          if ! git diff --quiet -- PLAYBOOK.md PLAYBOOK.ko.md; then
            echo "::error::합본이 references/{en,ko}/*.md 와 어긋납니다. 'npm run build' 후 커밋하세요."
            git diff --stat -- PLAYBOOK.md PLAYBOOK.ko.md
            exit 1
          fi
          echo "PLAYBOOK.md · PLAYBOOK.ko.md 는 references/{en,ko}/*.md 의 최신 합본입니다."
